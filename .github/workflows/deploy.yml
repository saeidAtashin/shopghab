name: Deploy shopghab.ir

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-shopghab
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script_stop: true
          script: |
            set -e
            DEPLOY_PATH="${{ secrets.DEPLOY_PATH }}"
            if [ -z "$DEPLOY_PATH" ]; then
              DEPLOY_PATH="/root/shopghab"
            fi

            if [ ! -d "$DEPLOY_PATH/.git" ]; then
              echo "Repo missing at $DEPLOY_PATH — clone it once on the server first."
              exit 1
            fi

            cd "$DEPLOY_PATH"
            git fetch origin main
            git reset --hard origin/main

            if [ ! -f shopghab.env ]; then
              echo "Missing shopghab.env on server. Copy from shopghab.env.example and fill secrets."
              exit 1
            fi

            # Stop/remove any leftover containers named shopghab
            docker ps -aq --filter "name=shopghab" | xargs -r docker rm -f

            docker compose down --remove-orphans || true
            docker compose up -d --build --force-recreate

            docker compose ps
            echo "Deploy finished: shopghab container replaced."
