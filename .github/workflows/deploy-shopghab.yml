name: Deploy shopghab to VPS

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: shopghab-production
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install and build
        env:
          NEXT_PUBLIC_SITE_URL: https://shopghab.ir
          NEXT_PUBLIC_API_TENANT_ID: shop-ghab
          NEXT_PUBLIC_GA_MEASUREMENT_ID: G-VTXN9PPFPE
        run: npm ci --legacy-peer-deps && npm run build

      - name: Pack Next.js build
        run: |
          tar -czf shopghab-next.tgz .next/standalone .next/static
          printf '%s\n' "${{ github.sha }}" > deploy-sha.txt

      - name: Publish deploy-latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view deploy-latest >/dev/null 2>&1; then
            gh release create deploy-latest \
              --target "${{ github.sha }}" \
              --title "deploy-latest" \
              --notes "Production Next.js build."
          fi
          gh release upload deploy-latest shopghab-next.tgz --clobber
          gh release upload deploy-latest deploy-sha.txt --clobber
