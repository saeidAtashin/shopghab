services:
  shopghab:
    build: .
    container_name: shopghab
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file:
      - shopghab.env
    environment:
      NODE_ENV: production
      DATABASE_URL: file:/data/app.db
    volumes:
      - shopghab-data:/data
      - shopghab-uploads:/app/public/uploads

volumes:
  shopghab-data:
  shopghab-uploads:
