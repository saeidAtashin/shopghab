# nginx site config for shopghab.ir
# Install via: bash deploy/bootstrap-shopghab.sh
# Certs: /etc/nginx/ssl/shopghab.ir/{fullchain.pem,privkey.pem}
# Canonical host is https://shopghab.ir (matches NEXT_PUBLIC_SITE_URL).

server {
    listen 80;
    listen [::]:80;
    server_name www.shopghab.ir;
    return 301 https://shopghab.ir$request_uri;
}

server {
    listen 80;
    listen [::]:80;
    server_name shopghab.ir;
    return 301 https://shopghab.ir$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name www.shopghab.ir;

    ssl_certificate /etc/nginx/ssl/shopghab.ir/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/shopghab.ir/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    return 301 https://shopghab.ir$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name shopghab.ir;

    ssl_certificate /etc/nginx/ssl/shopghab.ir/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/shopghab.ir/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    location / {
        proxy_pass http://127.0.0.1:3002;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}
